<section id="invite">
  <div class="invite-section">
    <div class="envelope-wrapper" tabindex="0"
         [class.shaking]="isOpening" 
         [class.opened]="isOpened" 
         (click)="openInvite()">
      <img
        [src]="isOpened ? 'envelope-aberto.png' : 'envelope.png'"
        alt="Convite"
      />
    </div>
  </div>
</section>
